<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 bg-cover bg-center"
    style="background-image: url('../../../../assets/images/rrms.jpg');">

    <div class="flex flex-col flex-auto items-start sm:justify-center min-w-0 bg-cover bg-center pl-6 sm:pl-16 ">
        <div
            class="w-full bg-white/0.1 backdrop-blur-md  border-2 border-solid border-primary-900 p-6 sm:mx-0 rounded-2xl attractive-shadow animate-fade-in">
            <!-- Logo -->
            <div class="w-20 h-20 flex items-center justify-center rounded-full bg-white mx-auto">
                <img src="assets/images/KSPPCW-logo.png" class="object-contain w-20 h-20 " />
            </div>

            <!-- Title -->
            <div
                class="mt-2 text-4xl  font-extrabold tracking-tight bg-gradient-to-r  text-center bg-clip-text drop-shadow-lg tracking-wider text-blue-800">
               Forgot password</div>
            <!-- <div class="flex items-baseline mt-0.5 font-medium">
                    <div>Don't have an account?</div>
                    <a
                        class="ml-1 text-primary-500 hover:underline"
                        [routerLink]="['/sign-up']">Sign up
                    </a>
                </div> -->

            <!-- Alert -->
            <fuse-alert class="mt-2" *ngIf="showAlert" [appearance]="'outline'" [showIcon]="false" [type]="alert.type"
                [@shake]="alert.type === 'error'">
                {{alert.message}}
            </fuse-alert>

            <!-- Sign in form -->
            <form class="mt-3" [formGroup]="forgotPasswordForm" #signInNgForm="ngForm">

               
                <mat-form-field class="w-full">
                    <mat-label *transloco="let t" class="font-medium">{{t('firstName')}}</mat-label>
                    <input matInput [formControlName]="'firstName'" (keypress)="allowOnlyLetters($event)" maxlength="10"
                        placeholder="Enter First name" >
                    <mat-error *ngIf="forgotPasswordForm.get('firstName').hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label *transloco="let t" class="font-medium">{{t('lastName')}}</mat-label>
                    <input matInput [formControlName]="'lastName'" (keypress)="allowOnlyLetters($event)" maxlength="10"
                        placeholder="Enter Last name" >
                    <mat-error *ngIf="forgotPasswordForm.get('lastName').hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label *transloco="let t" class="font-medium">{{t('empMobileno')}}</mat-label>
                    <input matInput [formControlName]="'mobileNo'" (keypress)="allowOnlyNumbers($event)" maxlength="10"
                        placeholder="Enter mobile number" >
                    <mat-error *ngIf="forgotPasswordForm.get('mobileNo').hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label *transloco="let t" class="font-medium">{{t('userEmail')}}</mat-label>
                    <input matInput [formControlName]="'emailID'" placeholder="Enter email" >
                    <mat-error *ngIf="forgotPasswordForm.get('emailID').hasError('required')">
                        Required
                    </mat-error>
                </mat-form-field>

                <div class="mt-2 w-full  text-md font-medium text-secondary text-center">
                    <span>Go to</span>
                    <a class="ml-1 text-white hover:underline" [routerLink]="['/sign-in']">sign in
                    </a>
                </div>
                <button class="fuse-mat-button-large w-full mt-8" mat-flat-button [color]="'primary'"
                    [disabled]="forgotPasswordForm.disabled" (click)="signIn()">
                    <span *ngIf="!forgotPasswordForm.disabled">
                      Forgot password
                    </span>
                    <mat-progress-spinner *ngIf="forgotPasswordForm.disabled" [diameter]="24"
                        [mode]="'indeterminate'"></mat-progress-spinner>
                </button>
            </form>
        </div>
    </div>

</div>
