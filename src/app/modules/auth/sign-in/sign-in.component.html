<div class="flex flex-col flex-auto items-center sm:justify-center min-w-0 bg-cover bg-center" style="background-image: url('../../../../assets/images/rrms.jpg');">

        <div class="flex flex-col flex-auto items-start sm:justify-center min-w-0 bg-cover bg-center pl-6 sm:pl-16 ">
            <div class="w-full bg-white/0.1 backdrop-blur-md  border-2 border-solid border-primary-900 p-6 sm:mx-0 rounded-2xl attractive-shadow animate-fade-in">
                <!-- Logo -->
                <div class="w-20 h-20 flex items-center justify-center rounded-full bg-white mx-auto">
                    <img src="assets/images/KSPPCW-logo.png" class="object-contain w-20 h-20 " />
                </div>
    
                <!-- Title -->
                <div class="mt-2 text-4xl  font-extrabold tracking-tight bg-gradient-to-r  text-center bg-clip-text drop-shadow-lg tracking-wider text-blue-800">Sign in</div>
                <!-- <div class="flex items-baseline mt-0.5 font-medium">
                    <div>Don't have an account?</div>
                    <a
                        class="ml-1 text-primary-500 hover:underline"
                        [routerLink]="['/sign-up']">Sign up
                    </a>
                </div> -->
    
                <!-- Alert -->
                <fuse-alert
                    class="mt-2"
                    *ngIf="showAlert"
                    [appearance]="'outline'"
                    [showIcon]="false"
                    [type]="alert.type"
                    [@shake]="alert.type === 'error'">
                    {{alert.message}}
                </fuse-alert>
    
                <!-- Sign in form -->
                <form 
                    class="mt-3"
                    [formGroup]="signInForm"
                    #signInNgForm="ngForm">
    
                    <!-- Email field -->
                    <mat-form-field class="w-full">
                        <mat-label class="text-xl text-white">KGID</mat-label>
                        <input
                            id="kgid"
                            matInput
                            (keypress)="allowOnlyNumbers($event)"
                            [formControlName]="'kgid'">
                        <mat-error *ngIf="signInForm.get('kgid').hasError('required')">
                         kgid is required
                        </mat-error>
                       
                    </mat-form-field>
    
                    <!-- Password field -->
                    <mat-form-field class="w-full">
                        <mat-label class="text-xl text-white">Password</mat-label>
                        <input
                            id="password"
                            matInput
                            type="password"
                            [formControlName]="'password'"
                            #passwordField>
                        <button
                            mat-icon-button
                            type="button"
                            (click)="passwordField.type === 'password' ? passwordField.type = 'text' : passwordField.type = 'password'"
                            matSuffix>
                            <mat-icon
                                class="icon-size-5"
                                *ngIf="passwordField.type === 'password'"
                                [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                            <mat-icon
                                class="icon-size-5"
                                *ngIf="passwordField.type === 'text'"
                                [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
                        </button>
                        <mat-error *ngIf="signInForm.get('password').hasError('required')">
                            Password is required
                        </mat-error>
                        <mat-error *ngIf="signInForm.get('password').hasError('pattern')">
                            Password must contain at least 8 characters, one uppercase letter, one lowercase letter, one
                            number and one special character
                        </mat-error>
                    </mat-form-field>
    
                    <!-- Actions -->
                    <!-- <div class="flex items-center justify-between w-full mt-1.2">
                           <a
                            class="text-md font-medium text-white hover:underline"
                            [routerLink]="['/forgot-password']">Forgot password?
                        </a>
                        <a
                            class="text-md font-medium text-white hover:underline"
                            [routerLink]="['/reset-password']">Reset password?
                        </a>
                    </div> -->

                    <div class="mt-2 w-full  text-md font-medium text-secondary text-center">
                    <a class="ml-1 text-white hover:underline" [routerLink]="['/reset-password']">Reset password
                    </a>
                </div>
    
                    <!-- Submit button -->
                    <button
                        class="fuse-mat-button-large w-full mt-8"
                        mat-flat-button
                        [color]="'primary'"
                        [disabled]="signInForm.disabled"
                        (click)="signIn()" >
                        <span *ngIf="!signInForm.disabled">
                            Sign in
                        </span>
                        <mat-progress-spinner
                            *ngIf="signInForm.disabled"
                            [diameter]="24"
                            [mode]="'indeterminate'"></mat-progress-spinner>
                    </button>
                </form>
            </div>
        </div>
    
</div>
