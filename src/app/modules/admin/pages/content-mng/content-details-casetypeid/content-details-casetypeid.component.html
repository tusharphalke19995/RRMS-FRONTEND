<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">

  <!-- Header -->
  <div class="relative flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between py-2 px-6 md:px-8 border-b">
    <!-- Loader -->
    <div class="absolute inset-x-0 bottom-0" *ngIf="isLoading">
      <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
    </div>
    <!-- Title -->

    <div class="flex-1 min-w-0">
      <!-- Breadcrumbs -->
      <div>
        <div class="hidden sm:flex flex-wrap items-center font-medium">
          <ng-container *transloco="let t">
            <div>
              <a class="whitespace-nowrap text-primary-500 cursor-pointer" [routerLink]="'/dashboard'">
                {{t('Home')}} </a>
            </div>
          </ng-container>

          <div class="flex items-center ml-1 whitespace-nowrap">
            <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
            <ng-container>
              <span class="ml-1 text-secondary">
                Content Management
              </span>
            </ng-container>
            <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
            <ng-container>
              <span class="ml-1 text-secondary">
                Folder
              </span>
              <ng-container *ngIf="year">
                <mat-icon class="icon-size-5 text-secondary mx-1" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
                <a class="text-primary-500 cursor-pointer" [routerLink]="'/content-management'">
                  {{ year }}
                </a>
              </ng-container>
            </ng-container>

            <ng-container *ngIf="caseNo">
              <mat-icon class="icon-size-5 text-secondary mx-1" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
              <a class="text-primary-500 cursor-pointer" [routerLink]="'/content-management/folders'"
                [queryParams]="{name: year}">
                {{ caseNo }}
              </a>
            </ng-container>

            <ng-container *ngIf="caseTypeId">
              <mat-icon class="icon-size-5 text-secondary mx-1" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
              <a class="text-primary-500 cursor-pointer" [routerLink]="'/content-management/folders/caseTypeid'"
                [queryParams]="{ name: year, caseNo: caseNo }">
                {{ caseTypeId }}
              </a>
            </ng-container>


          </div>

        </div>
        <div class="flex sm:hidden">
          <a class="inline-flex items-center -ml-1.5 text-secondary font-medium">
            <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
            <span class="ml-1">Back</span>
          </a>
        </div>
      </div>
      <!-- Title -->

      <div class="mt-2 flex items-center justify-between">
        <ng-container>
          <div class="text-3xl md:text-3xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
            Content Management
          </div>
        </ng-container>

      </div>
    </div>


  </div>

  <!-- Main -->
  <div class="flex-auto p-6 sm:p-5 overflow-y-auto" cdkScrollable>
    <div class="flex flex-auto overflow-hidden">
      <fuse-alert class="mb-8" *ngIf="alert" [type]="alert.type" [showIcon]="false">
        {{alert.message}}
      </fuse-alert>
    </div>
    <div class="overflow-x-auto">
      <ng-container *ngIf="items && (items.folders.length > 0 || items.files.length > 0); else noItems">
        <div class="p-6 md:p-8 space-y-8">
          <!-- Folders -->
          <ng-container *ngIf="items.folders.length > 0">
            <div>
              <div class="font-medium">Folders</div>
              <div class="flex flex-wrap -m-2 mt-2">
                <ng-container *ngFor="let folder of items.folders; trackBy:trackByFn">
                  <div class="relative w-40 h-40 m-2 p-4 shadow rounded-2xl bg-card">
                    <a class="absolute z-20 top-1.5 right-1.5 w-8 h-8 min-h-8" (click)="$event.preventDefault()"
                      mat-icon-button>
                      <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:information-circle'"></mat-icon>
                    </a>
                    <a class="z-10 absolute inset-0 flex flex-col p-4 cursor-pointer"
                      (click)="goToCaseFileTypIdDetails(folder)">
                      <div class="aspect-[9/6]">
                        <div class="flex items-center justify-center h-full">
                          <!-- Icon -->
                          <mat-icon class="icon-size-14 text-hint opacity-50"
                            [svgIcon]="'heroicons_solid:folder'"></mat-icon>
                        </div>
                      </div>
                      <div class="flex flex-col flex-auto justify-center text-center text-sm font-medium">
                        <div class="truncate" [matTooltip]="folder.name">{{folder.name}}</div>
                        <ng-container *ngIf="folder.contents">
                          <div class="text-secondary truncate">{{folder.contents}}</div>
                        </ng-container>
                      </div>
                    </a>
                  </div>
                </ng-container>
              </div>
            </div>
          </ng-container>

          <!-- Files -->
          <ng-container *ngIf="items.files.length > 0">
        <ng-container>
            <div>
              <div class="font-medium">Files</div>
              <div class="flex flex-wrap -m-2 mt-2">

                <ng-container *ngFor="let file of items.files; trackBy: trackByFn">

                  <a class="flex flex-col w-40 h-40 m-2 p-4 shadow rounded-2xl cursor-pointer bg-card">
                    <div class="aspect-[9/6]">
                      <div class="flex items-center justify-center h-full">
                        <div class="relative">
                          <mat-icon class="icon-size-14 text-hint opacity-50"
                            [svgIcon]="getFileIcon(getFileExtension(file.name))" (click)="viewImage(file)">
                          </mat-icon>
                          <div
                            class="absolute left-0 bottom-0 px-1.5 rounded text-sm font-semibold leading-5 text-white"
                            [ngClass]="{
                 'bg-red-600': (file.name || '').toUpperCase() === 'PDF',
                 'bg-blue-600': (file.name || '').toUpperCase() === 'DOC',
                 'bg-green-600': (file.name || '').toUpperCase() === 'XLS',
                 'bg-gray-600': (file.name || '').toUpperCase() === 'TXT',
                 'bg-amber-600': (file.name || '').toUpperCase() === 'JPG'
               }">
                          </div>
                        </div>
                      </div>
                    </div>
                    <div class="flex flex-col flex-auto justify-center text-center text-sm font-medium"
                      (click)="openMoveDialog(file)">
                      <div class="truncate" [matTooltip]="file.name">{{ file.name }}</div>
                    </div>
                  </a>
                </ng-container>


              </div>
            </div>
          </ng-container>
      </ng-container>
        </div>
      </ng-container>
     

      <ng-template #noItems>
        <div class="flex flex-auto flex-col items-center justify-center bg-gray-100 dark:bg-transparent">
          <mat-icon class="icon-size-24" [svgIcon]="'heroicons_outline:folder-open'"></mat-icon>
          <div class="mt-4 text-2xl font-semibold tracking-tight text-secondary">There are no items!</div>
        </div>
      </ng-template>
    </div>


  </div>

  <!-- Buttons -->

</div>
