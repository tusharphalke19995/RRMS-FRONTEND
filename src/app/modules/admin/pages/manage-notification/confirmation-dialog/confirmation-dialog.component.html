<div class="flex flex-col max-w-340 md:min-w-160 max-h-screen">


  <!-- Header with improved styling -->
  <div
    class="flex flex-0 items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md"
    cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle cdkDrag>
    <div class="flex items-center">
      <span class="text-xl font-semibold tracking-tight" *transloco="let t">{{t('confirmApprove')}}</span>
    </div>
    <button mat-icon-button class=" rounded-full transition-colors duration-200" (click)="onCancel()" [tabIndex]="-1">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <!-- Form Content -->
  <div class="flex flex-col flex-auto p-6 overflow-y-auto">
    <!-- First Row -->
    <h5 class="text-center font-semibold text-xl"> Are you sure you want to approve this request?</h5>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-3 mt-6 pt-4 border-t">
      <button mat-flat-button
        class="min-w-[90px] px-6 py-2 rounded-full bg-primary-600 text-white hover:bg-primary-700 transition-colors duration-200"
        (click)="onApprove()" *transloco="let t">
        {{t('approve')}}
      </button>
      <button mat-stroked-button
        class="min-w-[90px] px-6 py-2 rounded-full border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200"
        (click)="onCancel()" *transloco="let t">

        {{t('cancel')}}
      </button>
    </div>
  </div>
</div>
