<div class="flex flex-col max-w-120 md:min-w-100 max-h-screen">
    <!-- Header with improved styling -->
    <div class="flex flex-0 items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md"
        cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle cdkDrag>


        <div class="flex items-center">
            <span class="text-xl font-semibold tracking-tight" *ngIf="updateBool; else addRoleTemplate">
                {{ 'updateCaseStatus' | transloco }}
            </span>
            <ng-template #addRoleTemplate>
                <span class="text-xl font-semibold tracking-tight">
                    {{ 'addCaseStatus' | transloco }}
                </span>
            </ng-template>
        </div>
        <button mat-icon-button class=" rounded-full transition-colors duration-200" (click)="onNoClose()"
            [tabIndex]="-1">
            <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
        </button>
    </div>

    <!-- Form Content -->
    <form [formGroup]="SMTPSettingForm" class="flex flex-col flex-auto p-6 overflow-y-auto">
        <!-- First Row -->
        <div class="grid grid-cols-3 md:grid-cols-2 lg:grid-cols-2">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label *transloco="let t" class="font-medium">{{t('smtpServerName')}}</mat-label>
                <input matInput [formControlName]="'smtpServerName'" placeholder="Enter SMTP Server Name">
                <mat-error *ngIf="SMTPSettingForm.get('smtpServerName').hasError('required')">
                    Required
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full">
                <mat-label *transloco="let t" class="font-medium">{{t('portNo')}}</mat-label>
                <input matInput [formControlName]="'portNo'" placeholder="Enter Port No">
                <mat-error *ngIf="SMTPSettingForm.get('portNo').hasError('required')">
                    Required
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full">
                <mat-label *transloco="let t" class="font-medium">{{t('encryption')}}</mat-label>
                <input matInput [formControlName]="'encryption'" placeholder="Enter Encryption">
                <mat-error *ngIf="SMTPSettingForm.get('encryption').hasError('required')">
                    Required
                </mat-error>
            </mat-form-field>

        </div>
        <div class="grid grid-cols-3 md:grid-cols-2 lg:grid-cols-2">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label *transloco="let t" class="font-medium">{{t('username')}}</mat-label>
                <input matInput [formControlName]="'username'" placeholder="Enter Username">
                <mat-error *ngIf="SMTPSettingForm.get('username').hasError('required')">
                    Required
                </mat-error>
            </mat-form-field>
            <mat-form-field appearance="outline" class="w-full">
                <mat-label *transloco="let t" class="font-medium">{{t('password')}}</mat-label>
                <input matInput [formControlName]="'password'" placeholder="Enter Password">
                <mat-error *ngIf="SMTPSettingForm.get('password').hasError('required')">
                    Required
                </mat-error>
            </mat-form-field>
        </div>
        <!-- Action Buttons -->
        <div class="flex justify-end space-x-3 mt-6 pt-4 border-t">
            <ng-container *ngIf="!updateBool">
                <button mat-flat-button
                    class="min-w-[90px] px-6 py-2 rounded-full bg-primary-600 text-white hover:bg-primary-700 transition-colors duration-200"
                    (click)="saveSMTPSetting()" [disabled]="this.SMTPSettingForm.invalid" *transloco="let t">
                    {{t('submit')}}
                </button>
            </ng-container>

            <ng-container *ngIf="updateBool">
                <button mat-flat-button
                    class="min-w-[90px] px-6 py-2 rounded-full bg-primary-600 text-white hover:bg-primary-700 transition-colors duration-200"
                    (click)="updateSMTPSetting()" [disabled]="this.SMTPSettingForm.invalid" *transloco="let t">
                    {{t('update')}}
                </button>
            </ng-container>

            <button mat-stroked-button
                class="min-w-[90px] px-6 py-2 rounded-full border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200"
                (click)="onNoClose()" *transloco="let t">

                {{t('cancel')}}
            </button>
        </div>
    </form>
</div>
