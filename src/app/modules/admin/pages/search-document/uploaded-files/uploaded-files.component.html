<div class="flex flex-col max-w-340 md:min-w-160 max-h-screen">
  <div
    class="flex flex-0 items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md"
    cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle cdkDrag>
    <div class="flex items-center">
      <span class="text-xl font-semibold tracking-tight" *transloco="let t">{{t('doc')}}</span>
    </div>
    <button mat-icon-button class=" rounded-full transition-colors duration-200" (click)="onNoClose()" [tabIndex]="-1">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <div class="flex flex-col mt-6 pt-4 border-t" *ngIf="isImage">
    <h3 class="text-xl font-semibold text-center mb-4">Image</h3>
  
    <!-- Image Gallery Section -->
    <div class="flex flex-wrap justify-center">
      <div *ngFor="let data of imageFiles; trackBy: trackByFn" class="w-full sm:w-1/2 lg:w-1/3 xl:w-1/4 p-2">
        <div class="mb-4">
          <img [src]="data" alt="Image" class="w-full h-auto imageShow rounded-md" />
        </div>
      </div>
    </div>

    <h3 class="text-xl font-semibold text-center mb-4 mt-8">PDF</h3>
  
    <!-- PDF Gallery Section -->
    <div class="flex flex-wrap justify-center" *ngIf="isPdf">
      <div *ngFor="let data of pdfFiles; trackBy: trackByFn" class="w-full sm:w-1/2 lg:w-1/3 xl:w-1/4 p-2">
        <div class="mb-4">
          <iframe [src]="getSafeUrl(data)" class="w-full h-96 rounded-md" frameborder="0"></iframe>
        </div>
      </div>
    </div>
  </div>
  

  <div class="flex justify-center mt-6 py-5">
    <button mat-stroked-button
      class="min-w-[90px] px-6 py-2 rounded-full border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200"
      (click)="onNoClose()" *transloco="let t">
      {{t('cancel')}}
    </button>
  </div>
</div>
