<div class="flex flex-col w-full max-w-3xl h-[90vh] bg-white rounded-lg shadow-lg overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md">
    <div class="flex-1 flex items-center">
      <span class="text-xl font-semibold tracking-tight truncate" *transloco="let t">{{t('doc')}}</span>
    </div>
    <button mat-icon-button (click)="onNoClose()" [tabIndex]="-1">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <!-- Preview Area -->
  <div class="flex-1 flex flex-col items-center justify-center bg-gray-50 overflow-auto p-4">
    <!-- Image Preview -->
    <ng-container *ngIf="imageFiles.length > 0">
      <div class="flex flex-col items-center w-full">
        <img
          *ngFor="let data of imageFiles; trackBy: trackByFn"
          [src]="data"
          alt="Image"
          class="object-contain max-h-[70vh] max-w-full rounded-lg shadow-lg mb-4"
        />
      </div>
    </ng-container>

    <!-- PDF Preview -->
    <ng-container *ngIf="pdfFiles.length > 0">
      <div class="flex flex-col items-center w-full">
        <iframe
          *ngFor="let data of pdfFiles; trackBy: trackByFn"
          [src]="getSafeUrl(data)"
          class="w-full h-[70vh] rounded-lg shadow-lg mb-4"
          frameborder="0"
        ></iframe>
        <a
          *ngFor="let data of pdfFiles; trackBy: trackByFn"
          [href]="data"
          target="_blank"
          class="mt-2 text-blue-600 underline"
        >
          Open PDF in new tab
        </a>
      </div>
    </ng-container>
  </div>

  <!-- Footer -->
  <div class="flex justify-center py-4 border-t">
    <button mat-stroked-button (click)="onNoClose()">
      <mat-icon>close</mat-icon> Close
    </button>
  </div>
</div>
