<div class="flex flex-col w-full max-w-3xl h-[90vh] bg-white rounded-lg shadow-lg overflow-hidden">
  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md">
    <div class="flex-1 flex items-center">
      <span class="text-xl font-semibold tracking-tight truncate" *transloco="let t">Move Files</span>
    </div>
    <button mat-icon-button (click)="close()" [tabIndex]="-1">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <div class="move-file-dialog p-6 flex flex-col flex-1 overflow-hidden">
    <!-- Selected Files Section -->
    <div class="selected-files mb-4" *ngIf="fileDetails.length > 0">
      <h3 class="text-lg font-medium mb-2">Selected Files ({{ fileDetails.length }})</h3>
      <div class="file-list max-h-32 overflow-y-auto bg-gray-50 rounded-lg p-2">
        <div class="file-item flex items-center p-2 hover:bg-gray-100 rounded" *ngFor="let file of fileDetails">
          <mat-icon class="file-icon mr-2 text-gray-600">{{ getFileIcon(file.name) }}</mat-icon>
          <span class="file-name text-sm truncate">{{ file.name }}</span>
        </div>
      </div>
    </div>

    <!-- Breadcrumbs -->
    <div class="breadcrumbs mb-4 flex items-center flex-wrap gap-2">
      <button mat-button class="home-button" (click)="navigateToRoot()">
        <mat-icon>home</mat-icon>
        <span>Root</span>
      </button>
      <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
        <mat-icon class="crumb-separator text-gray-400">chevron_right</mat-icon>
        <button mat-button [class.active]="last" (click)="navigateToFolder(crumb)">
          <mat-icon>folder</mat-icon>
          <span>{{ crumb.name }}</span>
        </button>
      </ng-container>
    </div>

    <!-- Folder Tree -->
    <div class="folder-tree-container flex-1 overflow-auto relative" [class.loading]="loading$ | async">
      <div class="loading-overlay absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center" *ngIf="loading$ | async">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="folder-tree">
        <!-- Folder Node -->
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="tree-node flex items-center p-2 hover:bg-gray-100 rounded cursor-pointer" 
               [class.selected]="isNodeSelected(node)" 
               [class.disabled]="node.level === '0'"
               (click)="selectNode(node)">
            <button mat-icon-button 
                    class="toggle-button"
                    (click)="toggleNode(node, $event)">
              <mat-icon [@rotateIcon]="treeControl.isExpanded(node) ? 'expanded' : 'collapsed'">
                {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
              </mat-icon>
            </button>
            <div class="node-content flex items-center flex-1">
              <mat-icon class="node-icon mr-2 text-gray-600">folder</mat-icon>
              <div class="node-details">
                <span class="node-name">{{ node.name }}</span>
              </div>
            </div>
          </div>
          <div [class.tree-invisible]="!treeControl.isExpanded(node)" class="tree-node-children pl-8">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>

        <!-- Leaf Node -->
        <mat-tree-node *matTreeNodeDef="let node; when: isLeaf">
          <div class="tree-node flex items-center p-2 hover:bg-gray-100 rounded cursor-pointer"
               [class.selected]="isNodeSelected(node)" 
               (click)="selectNode(node)">
            <div class="node-content flex items-center flex-1">
              <mat-icon class="node-icon mr-2 text-gray-600">folder</mat-icon>
              <div class="node-details">
                <span class="node-name">{{ node.name }}</span>
              </div>
            </div>
          </div>
        </mat-tree-node>
      </mat-tree>
    </div>

    <!-- Selected Path -->
    <div class="selected-path mt-4 p-4 bg-gray-50 rounded-lg" *ngIf="selectedNode">
      <h3 class="text-lg font-medium mb-2">Selected Destination</h3>
      <div class="path-info flex items-center">
        <mat-icon class="mr-2 text-gray-600">folder</mat-icon>
        <span class="text-gray-800">{{ selectedNode.name }}</span>
      </div>
    </div>

    <!-- Dialog Actions -->
    <div class="dialog-actions mt-4 flex justify-end gap-2">
      <button mat-button (click)="close()">Cancel</button>
      <button mat-flat-button color="primary" 
              (click)="confirmMove()" 
              [disabled]="!selectedNode || (loading$ | async)">
        <span *ngIf="!(loading$ | async)">Move Files</span>
        <mat-spinner diameter="20" *ngIf="loading$ | async"></mat-spinner>
      </button>
    </div>
  </div>
</div>
