<div class="flex flex-col w-full max-w-3xl h-[90vh] bg-white rounded-lg shadow-lg">
  <!-- Header -->
  <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md flex-shrink-0">
    <div class="flex-1 flex items-center">
      <span class="text-xl font-semibold tracking-tight truncate">File Operations</span>
    </div>
    <button mat-icon-button (click)="close()" [tabIndex]="-1">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <div class="move-file-dialog flex flex-col flex-1 overflow-hidden">
    <!-- Selected Files Section -->
    <div class="selected-files" *ngIf="fileDetails.length > 0">
      <h3 class="text-lg font-medium mb-2">Selected Files ({{ fileDetails.length }})</h3>
      <div class="file-list">
        <div class="file-item" *ngFor="let file of fileDetails">
          <mat-icon class="file-icon mr-2 text-gray-600">{{ getFileIcon(file.name) }}</mat-icon>
          <span class="file-name text-sm truncate">{{ file.name }}</span>
        </div>
      </div>
    </div>

    <!-- Folder Tree -->
    <div class="folder-tree-container" [class.loading]="loading$ | async">
      <div class="loading-overlay" *ngIf="loading$ | async">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
      
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="folder-tree">
        <!-- Folder Node -->
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="tree-node" 
               [class.selected]="isNodeSelected(node)" 
               [class.selectable]="node.type === 'folder' && node.level !== '0'"
               (click)="selectNode(node)">
            <button mat-icon-button 
                    class="toggle-button"
                    (click)="toggleNode(node, $event)">
              <mat-icon [@rotateIcon]="treeControl.isExpanded(node) ? 'expanded' : 'collapsed'">
                {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
              </mat-icon>
            </button>
            <div class="node-content">
              <mat-icon class="node-icon">folder</mat-icon>
              <span class="node-name">{{ node.name }}</span>
            </div>
          </div>
          <div [class.tree-invisible]="!treeControl.isExpanded(node)" class="tree-node-children">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>

        <!-- Leaf Node -->
        <mat-tree-node *matTreeNodeDef="let node; when: isLeaf">
          <div class="tree-node"
               [class.selected]="isNodeSelected(node)" 
               [class.selectable]="node.type === 'folder' && node.level !== '0'"
               (click)="selectNode(node)">
            <div class="node-content">
              <mat-icon class="node-icon">folder</mat-icon>
              <span class="node-name">{{ node.name }}</span>
            </div>
          </div>
        </mat-tree-node>
      </mat-tree>
    </div>

    <!-- Selected Path -->
    <div class="selected-path" *ngIf="selectedNode">
      <h3 class="text-lg font-medium mb-2">Selected Destination</h3>
      <div class="path-info flex items-center">
        <mat-icon class="mr-2 text-gray-600">folder</mat-icon>
        <span class="text-gray-800">{{ selectedNode.name }}</span>
      </div>
    </div>

    <!-- Dialog Actions -->
    <div class="dialog-actions">
      <button mat-button (click)="close()">Cancel</button>
      <button mat-button color="warn" (click)="confirmArchive()">
        Archive Files
      </button>
      <button mat-flat-button color="primary" 
              (click)="confirmMove()" 
              [disabled]="!selectedNode || (loading$ | async)">
        <span *ngIf="!(loading$ | async)">Move Files</span>
        <mat-spinner diameter="20" *ngIf="loading$ | async"></mat-spinner>
      </button>
    </div>
  </div>
</div>
