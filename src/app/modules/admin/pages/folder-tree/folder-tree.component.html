<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">
  <div class="folder-tree-container">
    <!-- Header Section -->
    <div class="header-section">
      <h5></h5>
    </div>

    <!-- Navigation Section -->
    <div class="navigation-section">
      <div class="breadcrumbs">
        <button mat-button class="home-button" (click)="navigateToRoot()">
          <mat-icon>home</mat-icon>
          <span>Root</span>
        </button>
        <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
          <mat-icon class="crumb-separator">chevron_right</mat-icon>
          <button mat-button [class.active]="last" (click)="navigateToFolder(crumb)">
            <mat-icon>folder</mat-icon>
            <span>{{ crumb.name }}</span>
          </button>
        </ng-container>
      </div>
    </div>

    <!-- Tree View Section -->
    <div class="tree-section">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="folder-tree">
        <!-- Folder Node -->
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="tree-node" [class.selected]="isItemSelected(node)" (click)="toggleItemSelection(node)">
            <button mat-icon-button 
                    class="toggle-button"
                    (click)="toggleNode(node, $event)">
              <mat-icon [@rotateIcon]="isExpanded(node) ? 'expanded' : 'collapsed'">
                {{ isExpanded(node) ? 'expand_more' : 'chevron_right' }}
              </mat-icon>
            </button>
            <div class="node-content">
              <mat-icon class="node-icon">{{ getItemIcon(node) }}</mat-icon>
              <div class="node-details">
                <span class="node-name">{{ node.name }}</span>
                <span class="node-level">{{ node.level }}</span>
              </div>
            </div>
          </div>

          <!-- Files in Current Folder -->
          <div class="files-container" *ngIf="node.files && node.files.length > 0">
            <div class="file-item" *ngFor="let file of node.files" [class.selected]="isItemSelected(file)" (click)="toggleItemSelection(file)">
              <div class="file-content">
                <mat-icon class="file-icon">{{ getFileIcon(file) }}</mat-icon>
                <div class="file-details">
                  <span class="file-name">{{ file.name }}</span>
                  <div class="file-meta">
                    <span class="uploader" *ngIf="file.uploaded_by">
                      <mat-icon>person</mat-icon>
                      <span>{{ file.uploaded_by }}</span>
                    </span>
                    <span class="date" *ngIf="file.created_at">
                      <mat-icon>calendar_today</mat-icon>
                      <span>{{ file.created_at | date:'medium' }}</span>
                    </span>
                  </div>
                </div>
              </div>
              <div class="file-actions">
                <button mat-icon-button [matMenuTriggerFor]="fileMenu" (click)="$event.stopPropagation()">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #fileMenu="matMenu">
                  <button mat-menu-item (click)="openMoveFileDialog(file)">
                    <mat-icon>drive_file_move</mat-icon>
                    <span>Move</span>
                  </button>
                </mat-menu>
              </div>
            </div>
          </div>

          <!-- Child Nodes -->
          <div [class.tree-invisible]="!isExpanded(node)" class="tree-node-children">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>
      </mat-tree>
    </div>
  </div>
</div>
