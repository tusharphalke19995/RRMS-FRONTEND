<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">
  <div class="folder-tree-container">
    <!-- Header Section -->
   
   <div class="flex-1 min-w-0">
      <!-- Breadcrumbs -->
      <div>
        <div class="hidden sm:flex flex-wrap items-center font-medium">
          <ng-container>
            <div>
              <a class="whitespace-nowrap text-primary-500 cursor-pointer">
                Home </a>
            </div>
          </ng-container>

          <div class="flex items-center ml-1 whitespace-nowrap">
            <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
            <ng-container>
              <span class="ml-1 text-secondary">
                Content Management
              </span>
            </ng-container>
          </div>

        </div>
        <div class="flex sm:hidden">
          <a class="inline-flex items-center -ml-1.5 text-secondary font-medium">
            <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
            <span class="ml-1">Back</span>
          </a>
        </div>
      </div>
      <!-- Title -->

      <div class="mt-2 flex items-center justify-between">
        <ng-container>
          <div class="text-3xl md:text-3xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
            Content Management
          </div>
        </ng-container>

      </div>
        <div class="tree-section">
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="folder-tree">
        <!-- Folder Node -->
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="tree-node" 
               [class.level-0]="node.level === 0"
               [class.level-1]="node.level === 1"
               [class.level-2]="node.level === 2"
               [class.level-3]="node.level === 3"
               [class.level-4]="node.level === 4"
               [class.selected]="isItemSelected(node)" 
               (click)="toggleItemSelection(node)">
            <button mat-icon-button 
                    class="toggle-button"
                    (click)="toggleNode(node, $event)">
              <mat-icon [@rotateIcon]="isExpanded(node) ? 'expanded' : 'collapsed'">
                {{ isExpanded(node) ? 'expand_more' : 'chevron_right' }}
              </mat-icon>
            </button>
            <div class="node-content">
              <mat-icon class="node-icon">{{ getItemIcon(node) }}</mat-icon>
              <div class="node-details">
                <span class="node-name">{{ node.name }}</span>
                <span class="node-level">{{ node.level }}</span>
              </div>
            </div>
          </div>

          <!-- Files in Current Folder -->
          <div class="files-container" *ngIf="node.files && node.files.length > 0">
            <div class="file-item" *ngFor="let file of node.files" [class.selected]="isItemSelected(file)" (click)="toggleItemSelection(file)">
              <div class="file-content">
                <mat-icon class="file-icon">{{ getFileIcon(file) }}</mat-icon>
                <div class="file-details">
                  <span class="file-name">{{ file.name }}</span>
                  <div class="file-meta">
                    <span class="uploader" *ngIf="file.uploaded_by">
                      <mat-icon>person</mat-icon>
                      <span>{{ file.uploaded_by }}</span>
                    </span>
                    <span class="date" *ngIf="file.created_at">
                      <mat-icon>calendar_today</mat-icon>
                      <span>{{ file.created_at | date:'medium' }}</span>
                    </span>
                  </div>
                </div>
              </div>
              <div class="file-actions">
                <button mat-icon-button [matMenuTriggerFor]="fileMenu" (click)="$event.stopPropagation()">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #fileMenu="matMenu">
                  <button mat-menu-item (click)="openMoveFileDialog(file)">
                    <mat-icon>drive_file_move</mat-icon>
                    <span>Move</span>
                  </button>
                </mat-menu>
              </div>
            </div>
          </div>

          <!-- Child Nodes -->
          <div [class.tree-invisible]="!isExpanded(node)" class="tree-node-children">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>
      </mat-tree>
    </div>
    </div>
    
  
  </div>
</div>
