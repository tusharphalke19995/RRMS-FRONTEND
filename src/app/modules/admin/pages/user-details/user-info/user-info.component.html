<div class="sm:absolute sm:inset-0 flex flex-col flex-auto min-w-0 sm:overflow-hidden bg-card dark:bg-transparent">
  <!-- Header -->
  <div class="relative flex flex-col sm:flex-row sm:items-center sm:justify-between py-4 px-6 md:px-8 border-b">
    <!-- Breadcrumbs -->
    <div class="flex-1 min-w-0">
      <div class="hidden sm:flex items-center font-medium space-x-2 text-sm">
        <ng-container *transloco="let t">
          <a class="text-primary-500 hover:underline" [routerLink]="'/dashboard'">
            {{ t('Home') }}
          </a>
        </ng-container>
        <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
        <ng-container *transloco="let t">
          <span class="text-secondary">User Details</span>
        </ng-container>
      </div>

      <!-- Mobile Back -->
      <div class="flex sm:hidden mt-2">
        <a class="inline-flex items-center text-secondary font-medium">
          <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
          <span class="ml-1">Back</span>
        </a>
      </div>

      <!-- Page Title -->
      <div class="mt-4">
        <ng-container *transloco="let t">
          <h1 class="text-3xl font-extrabold tracking-tight text-gray-800 dark:text-white">
            User Details
          </h1>
        </ng-container>
      </div>

      <!-- Role / Department Info -->
      <div class="mt-4 space-y-2 text-sm md:text-base text-gray-700 dark:text-gray-300" *ngIf="authData.SuperAdmin !=true">
        <p><strong>Role:</strong> {{ authData.Role }}</p>

        <p>
          <strong>Departments:</strong>
          <span *ngFor="let name of selectedDepartmentNames; let last = last">
            {{ name }}<span *ngIf="!last">, </span>
          </span>
        </p>

        <p>
          <strong>Divisions:</strong>
          <span *ngFor="let name of selectedDivisionNames; let last = last">
            {{ name }}<span *ngIf="!last">, </span>
          </span>
        </p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-auto p-6 sm:p-5 overflow-y-auto" cdkScrollable>
    <div class="flex flex-auto overflow-hidden">
      <fuse-alert class="mb-8" *ngIf="alert" [type]="alert.type" [showIcon]="false">
        {{ alert.message }}
      </fuse-alert>
    </div>

    <div class="p-6  w-full">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <p class="text-gray-500 dark:text-gray-400 text-sm">Email</p>
          <p class="font-semibold text-gray-900 dark:text-white">{{ authData.Email }}</p>
        </div>
        <div>
          <p class="text-gray-500 dark:text-gray-400 text-sm">User Name</p>
          <p class="font-semibold text-gray-900 dark:text-white">{{ authData.UserName }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
