<div class="flex flex-col max-w-340 md:min-w-160 max-h-screen">


  <!-- Header with improved styling -->
  <div
    class="flex flex-0 items-center justify-between px-6 py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md"
    cdkDragRootElement=".cdk-overlay-pane" cdkDragHandle cdkDrag>
    <div class="flex items-center">
      <span class="text-xl font-semibold tracking-tight" *transloco="let t">{{t('confirmApprove')}}</span>
    </div>
    <button mat-icon-button class="rounded-full transition-colors duration-200" (click)="onCancel()" [tabIndex]="-1">
      <mat-icon [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>
  <div class="flex flex-col flex-auto p-6 overflow-y-auto">
    <!-- First Row -->
    <h5 class="text-center font-semibold text-xl" *transloco="let t">{{t('reqTextApprove')}}</h5>
    <form [formGroup]="approvalReqlForm" class="flex flex-col flex-auto p-6 overflow-y-auto">
        <span class="font-bold text-lg text-gray-700">File Name:<mat-icon class=" align-middle text-primary"></mat-icon>
          <span class="text-gray-500">{{ data.file_name || 'No File Name' }}</span></span>
      <div class="mb-2 font-semibold text-lg text-gray-700">
        <span *transloco="let t">{{ t('revokeMsg') }}</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <!-- Start Date -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label *transloco="let t">{{ t('startDate') }}</mat-label>
          <input matInput [matDatepicker]="picker1" placeholder="Choose a date" formControlName="start_date"
            autocomplete="off" />
          <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
          <mat-error *ngIf="approvalReqlForm.get('start_date')?.hasError('required')">
            Start date is required
          </mat-error>
        </mat-form-field>

        <!-- End Date -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label *transloco="let t">{{ t('endDate') }}</mat-label>
          <input matInput [matDatepicker]="picker2" placeholder="Choose a date" formControlName="end_date"
            autocomplete="off" />
          <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
          <mat-datepicker #picker2></mat-datepicker>
          <mat-error *ngIf="approvalReqlForm.get('end_date')?.hasError('required')">
            End date is required
          </mat-error>
        </mat-form-field>
      </div>
      <div class="grid ">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Remarks</mat-label>
          <input matInput formControlName="remarks" placeholder="Enter Remarks" />
          <mat-error *ngIf="approvalReqlForm.get('remarks')?.hasError('required')">
            Remarks are required when denying.
          </mat-error>
        </mat-form-field>

      </div>

      <div class="flex justify-end space-x-3 mt-6 pt-4 border-t">
        <button mat-flat-button
          class="min-w-[90px] px-6 py-2 rounded-full bg-primary-600 text-white hover:bg-primary-700 transition-colors duration-200"
          (click)="approveRequestData('true')" *transloco="let t">
          {{t('approve')}}
        </button>
        <button mat-stroked-button
          class="min-w-[90px] px-6 py-2 rounded-full border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200"
          (click)="approveRequestData('false')" *transloco="let t">

          {{t('onDenied')}}
        </button>
        <button mat-stroked-button
          class="min-w-[90px] px-6 py-2 rounded-full border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors duration-200"
          (click)="onCancel()" *transloco="let t">

          {{t('cancel')}}
        </button>
      </div>
    </form>

  </div>
</div>
