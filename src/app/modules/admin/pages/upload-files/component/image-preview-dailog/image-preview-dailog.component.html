<div class="flex flex-col w-full max-w-3xl h-[90vh] bg-white rounded-lg shadow-lg overflow-hidden responsive-image-preview-dialog">
  <!-- Header -->
  <div
    class="flex items-center justify-between px-4 md:px-6 py-3 md:py-4 bg-gradient-to-r from-primary-600 to-primary-700 text-white shadow-md">
    <div class="flex-1 flex items-center min-w-0">
      <span class="text-lg md:text-xl font-semibold tracking-tight truncate" *transloco="let t">{{t('doc')}}</span>
    </div>
    <button mat-icon-button (click)="onNoClose()" [tabIndex]="-1" aria-label="Close dialog">
      <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x'"></mat-icon>
    </button>
  </div>

  <!-- Preview Area -->
  <div class="flex-1 flex flex-col items-center justify-center bg-gray-50 overflow-hidden p-2 md:p-4 w-full" style="min-height: 0;">
    <!-- Image Preview -->
    <ng-container *ngIf="imageFiles.length > 0">
      <div class="flex flex-wrap gap-4 justify-center w-full">
        <img *ngFor="let data of imageFiles; trackBy: trackByFn" [src]="data" alt="Image preview"
          class="object-contain max-h-[40vh] md:max-h-[70vh] max-w-full rounded-lg shadow-lg mb-2 md:mb-4 responsive-image" />
      </div>
    </ng-container>

    <!-- PDF Preview with Search -->
    <ng-container *ngIf="pdfFiles.length > 0">
      <div class="flex flex-col items-center w-full h-full pdf-preview-container">
        <!-- Search Bar - Always Visible -->
        <div class="w-full bg-white rounded-lg shadow-md search-bar-container" style="display: block !important; visibility: visible !important; opacity: 1 !important; position: sticky !important; top: 0 !important; z-index: 1000 !important;">
          <div class="flex flex-col md:flex-row gap-2 items-center">
            <div class="flex-1 w-full md:w-auto">
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Search in PDF</mat-label>
                <input matInput 
                       [(ngModel)]="searchText" 
                       (keyup)="onSearchKeyPress($event)"
                       placeholder="Enter text to search...">
                <mat-icon matPrefix>search</mat-icon>
              </mat-form-field>
            </div>
            <div class="flex gap-2 items-center flex-wrap w-full md:w-auto">
              <button mat-raised-button 
                      color="primary" 
                      (click)="searchInPdf()"
                      [disabled]="!searchText?.trim() || isSearching"
                      class="search-btn">
                <mat-icon *ngIf="!isSearching">search</mat-icon>
                <mat-icon *ngIf="isSearching" class="animate-spin">hourglass_empty</mat-icon>
                <span>{{ isSearching ? 'Searching...' : 'Search' }}</span>
              </button>
              
              <!-- Previous Button -->
              <button mat-raised-button 
                      color="accent"
                      (click)="findPrevious()"
                      [disabled]="searchMatches.length === 0 || !pageLoaded"
                      matTooltip="Previous match (Shift+F3)"
                      class="nav-btn previous-btn">
                <mat-icon>arrow_back</mat-icon>
                <span>Previous</span>
              </button>
              
              <!-- Match Counter -->
              <div *ngIf="searchMatches.length > 0" class="flex items-center gap-2 px-3 py-2 bg-blue-50 rounded-lg border border-blue-200">
                <mat-icon class="text-blue-600 text-sm">check_circle</mat-icon>
                <span class="text-xs md:text-sm font-medium text-blue-700 whitespace-nowrap">
                  Match: <strong>{{ currentMatchIndex + 1 }}</strong> of <strong>{{ searchMatches.length }}</strong>
                </span>
              </div>
              
              <!-- No matches message -->
              <div *ngIf="!isSearching && searchMatches.length === 0 && searchText?.trim()" 
                   class="flex items-center gap-2 px-3 py-2 bg-yellow-50 rounded-lg border border-yellow-200">
                <mat-icon class="text-yellow-600 text-sm">info</mat-icon>
                <span class="text-xs md:text-sm font-medium text-yellow-700 whitespace-nowrap">
                  No matches found
                </span>
              </div>
              
              <!-- Next Button -->
              <button mat-raised-button 
                      color="accent"
                      (click)="findNext()"
                      [disabled]="searchMatches.length === 0 || !pageLoaded"
                      matTooltip="Next match (F3)"
                      class="nav-btn next-btn">
                <span>Next</span>
                <mat-icon>arrow_forward</mat-icon>
              </button>
            </div>
          </div>
        </div>

        <!-- PDF Viewer Container -->
        <div class="flex flex-col items-center w-full flex-1 pdf-viewer-wrapper">
          <pdf-viewer
            #pdfViewer
            [src]="pdfSrc"
            [render-text]="true"
            [original-size]="false"
            [show-all]="false"
            [page]="currentPage"
            [zoom]="1"
            [zoom-scale]="'page-width'"
            [stick-to-page]="true"
            (after-load-complete)="afterLoadComplete($event)"
            (page-rendered)="onPageChange($event)"
            style="display: block; width: 100%; height: 100%; min-height: 600px;"
            class="border border-gray-300 rounded-lg shadow-lg">
          </pdf-viewer>
          
          <!-- Page Navigation -->
          <div class="flex items-center justify-center gap-4 mt-4">
            <button mat-icon-button 
                    (click)="previousPage()" 
                    [disabled]="currentPage <= 1 || !pageLoaded"
                    matTooltip="Previous page">
              <mat-icon>chevron_left</mat-icon>
            </button>
            <span class="text-sm text-gray-700">
              Page {{ currentPage }} of {{ totalPages }}
            </span>
            <button mat-icon-button 
                    (click)="nextPage()" 
                    [disabled]="currentPage >= totalPages || !pageLoaded"
                    matTooltip="Next page">
              <mat-icon>chevron_right</mat-icon>
            </button>
          </div>
        </div>

        <!-- Fallback: Open in new tab link -->
        <a *ngIf="pdfFiles.length > 0" [href]="pdfFiles[0]" target="_blank" rel="noopener noreferrer"
          class="mt-4 inline-flex items-center gap-2 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition-colors duration-200 text-sm md:text-base font-medium shadow-sm hover:shadow-md">
          <mat-icon class="text-lg">open_in_new</mat-icon>
          <span>Open PDF in new tab</span>
        </a>
      </div>
    </ng-container>

    <!-- Audio Preview -->
    <ng-container *ngIf="audioFiles.length > 0">
      <div class="flex flex-col items-center w-full">
        <audio *ngFor="let data of audioFiles; trackBy: trackByFn" [src]="data" controls class="w-full mb-2 md:mb-4 responsive-audio"></audio>
      </div>
    </ng-container>

    <!-- Video Preview -->
    <ng-container *ngIf="videoFiles.length > 0">
      <div class="flex flex-col items-center w-full">
        <video *ngFor="let data of videoFiles; trackBy: trackByFn" [src]="data" controls class="w-full mb-2 md:mb-4 responsive-video"></video>
      </div>
    </ng-container>

    <!-- Word Preview -->
    <ng-container *ngIf="wordViewerUrl">
      <div class="flex flex-col items-center w-full">
        <iframe [src]="wordViewerUrl" class="responsive-word w-full h-[40vh] md:h-[70vh] rounded-lg shadow-lg mb-2 md:mb-4" frameborder="0"></iframe>
      </div>
    </ng-container>

    <!-- Excel Preview -->
    <ng-container *ngIf="excelViewerUrl">
      <div class="flex flex-col items-center w-full">
        <iframe [src]="excelViewerUrl" class="responsive-excel w-full h-[40vh] md:h-[70vh] rounded-lg shadow-lg mb-2 md:mb-4" frameborder="0"></iframe>
      </div>
    </ng-container>
  </div>

  <!-- Footer -->
  <div class="flex justify-center py-3 md:py-4 border-t bg-white">
    <button mat-stroked-button (click)="onNoClose()">
      <mat-icon>close</mat-icon> <span class="hidden xs:inline">Close</span>
    </button>
  </div>
</div>
